name: Build APK from original source ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate uploaded original archive
        id: source
        shell: bash
        run: |
          if [ -f "./jarvis AI code" ]; then
            ZIP_FILE="./jarvis AI code"
          else
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          fi
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "Original uploaded archive not found in repository root." >&2
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          file "$ZIP_FILE"
          unzip -t "$ZIP_FILE" >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract original archive without patches
        shell: bash
        run: |
          mkdir source
          unzip -q "${{ steps.source.outputs.zip }}" -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found in original archive." >&2
            exit 1
          fi
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Create temporary Android debug keystore if missing
        shell: bash
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug APK
        shell: bash
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-original-source-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
